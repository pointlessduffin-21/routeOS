[platformio]
default_envs = virtual-hmi

[env:virtual-hmi]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
lib_deps =
    lvgl/lvgl@8.4.0
    links2004/WebSockets@2.7.1
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DWEBSOCKETS_SERVER_CLIENT_MAX=2
    -DWEBSOCKETS_TCP_TIMEOUT=2000
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:embed_web.py

[env:virtual-hmi-control]
extends = env:virtual-hmi
build_flags =
    ${env:virtual-hmi.build_flags}
    -DHMI_ALLOW_CONTROL=1
