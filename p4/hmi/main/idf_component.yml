dependencies:
  # The board is a Guition JC8012P4A1: its vendor BSP (components/esp32_p4_function_ev_board) has the right DSI
  # timing, backlight pin and GSL3680 touch. The Waveshare BSP used before could not sync this panel.
  idf: ">=5.3"
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # 2.8+ expects the IDF 6 DSI callback (on_frame_buf_complete); 2.7.2 matches IDF 5.5.
  espressif/esp_lvgl_port: "2.7.2"
  # The P4 has no radio of its own: Wi-Fi is the ESP32-C6 on the board, reached over SDIO.
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"