; =============================================================================
;  EcoRoute Smart Bin — PlatformIO Configuration
; =============================================================================

; Production firmware (HC-SR04 + HW-201 IR + battery + MQTT + captive portal)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
    ; Preferences and WebServer are built-in ESP32 Arduino libraries
    ; (no external dependency needed — listed here for documentation)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Legacy full web UI firmware (EcoRouteBin.ino with HTML dashboard)
[env:webui]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
src_dir = EcoRouteBin
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

; VL53L0X ToF sensor standalone test (I2C: SDA=GPIO21, SCL=GPIO22)
[env:tof-test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
build_src_filter = -<*> +<../tof-test/>
lib_deps =
    pololu/VL53L0X@^1.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=0

; TrashCan2 — production firmware with BLE + AP modes on /dev/cu.usbserial-0001
[env:tc2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
