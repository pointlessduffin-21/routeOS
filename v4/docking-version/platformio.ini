[platformio]
src_dir = .

[env:dock]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

; ── Simulator build env ────────────────────────────────────────────────────────
; Compiles with SIMULATOR_MODE_DEFAULT=1 so the device boots with simEnabled=true
; by default (overridable via NVS / web portal / serial SIM OFF).
; Use this env for QEMU emulation, CI testing, and demo/trade-show builds.
;   pio run -e dock-sim
;   pio run -e dock-sim -t upload
[env:dock-sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; No upload_port / monitor_port — intended for QEMU or any port
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSIMULATOR_MODE_DEFAULT=1
