; ── lid-version-simulated ─────────────────────────────────────────────────────
; Simulator-only build. SIMULATOR_MODE_DEFAULT=1 — boots with simEnabled=true.
; 3x ultrasonic (left/center/right) + HW-201 IR lid sensor.
;
; Flash:   pio run -e lid-sim -t upload
; Monitor: pio device monitor -e lid-sim

[env:lid-sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSIMULATOR_MODE_DEFAULT=1
