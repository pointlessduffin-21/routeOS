; ── docking-version-tof-simulated ────────────────────────────────────────────
; This is the SIMULATED build. SIMULATOR_MODE_DEFAULT=1 means the ESP32 boots
; with simEnabled=true — no real sensors needed. Safe to flash on a bare board
; for demo, CI, or trade-show use. Disable via web portal /simulator or serial
; command "SIM OFF".
;
; Flash:   pio run -e dock-sim -t upload
; Monitor: pio device monitor -e dock-sim

[env:dock-sim]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-562B0100951
monitor_port = /dev/cu.usbserial-562B0100951
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8.0
    pololu/VL53L0X@^1.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSIMULATOR_MODE_DEFAULT=1
