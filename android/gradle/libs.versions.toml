[versions]
agp             = "8.3.2"
kotlin          = "1.9.23"
compose-bom     = "2024.04.01"
lifecycle       = "2.7.0"
activity-compose = "1.9.0"
coroutines      = "1.8.0"
usb-serial      = "3.8.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose",         version.ref = "activity-compose" }
androidx-lifecycle-vm      = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom                = { group = "androidx.compose",   name = "compose-bom",             version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-preview         = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended     = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-coroutines         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
usb-serial-android         = { group = "com.github.mik3y", name = "usb-serial-for-android", version.ref = "usb-serial" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
